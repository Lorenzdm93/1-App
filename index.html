    />
    <title>1% — Get one percent better</title>
    <style>
      /* First-paint boot screen: brand-colored, zero-dependency, replaced the
         instant React mounts. Prevents any white flash on cold start. */
      html { background: #0c0d10; }
      @media (prefers-color-scheme: light) { html { background: #f4f2ee; } }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: inherit; z-index: 9999;
      }
      #boot .ring {
        width: 56px; height: 56px; border-radius: 50%;
        border: 4px solid rgba(127, 127, 127, 0.18);
        border-top-color: #35c78f;
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="font-family: system-ui; padding: 40px 24px; text-align: center; color: #888">
        1% needs JavaScript — it's a local-first app that runs entirely on your device.
      </div>
    </noscript>
    <div id="root"><div id="boot" aria-hidden="true"><div class="ring"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
