    <!-- Fonts are self-hosted: no third-party request leaves the device, and
         the typography survives a cold start with no network at all. Only the
         two latin faces are preloaded; latin-ext and the italics are fetched
         on demand by unicode-range / font-style. -->
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>1% — Get one percent better</title>
    <style>
      /* Inter (variable weight) and Fraunces (variable optical size +
         weight) — SIL Open Font License, see public/fonts/LICENSE-*.txt */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: swap; src: url(fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: swap; src: url(fonts/inter-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter'; font-style: italic; font-weight: 100 900;
        font-display: swap; src: url(fonts/inter-latin-italic.woff2) format('woff2');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      @font-face {
        font-family: 'Inter'; font-style: italic; font-weight: 100 900;
        font-display: swap; src: url(fonts/inter-latin-ext-italic.woff2) format('woff2');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fraunces'; font-style: normal; font-weight: 100 900;
        font-display: swap; src: url(fonts/fraunces-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces'; font-style: normal; font-weight: 100 900;
        font-display: swap; src: url(fonts/fraunces-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fraunces'; font-style: italic; font-weight: 100 900;
        font-display: swap; src: url(fonts/fraunces-latin-italic.woff2) format('woff2');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces'; font-style: italic; font-weight: 100 900;
        font-display: swap; src: url(fonts/fraunces-latin-ext-italic.woff2) format('woff2');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }
      /* First-paint boot screen: brand-colored, zero-dependency, replaced the
         instant React mounts. Prevents any white flash on cold start. */
      html { background: #0c0d10; }
      @media (prefers-color-scheme: light) { html { background: #f4f2ee; } }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: inherit; z-index: 9999;
      }
      #boot svg { width: 78px; height: 78px; color: #F2EFE9; animation: bootpulse 1.6s ease-in-out infinite; }
      @media (prefers-color-scheme: light) { #boot svg { color: #14161a; } }
      @keyframes bootpulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>
