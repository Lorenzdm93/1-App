<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6FA8DC"/>
      <stop offset="1" stop-color="#35c78f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c78f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#35c78f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="260" fill="#35c78f" opacity="0.05"/>

  <!-- the mark -->
  <g transform="translate(96,86) scale(1.68)">
    <path d="M 10 78 C 38 76, 58 66, 80 36" fill="none" stroke="url(#swoosh)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="82.5" cy="32" r="4.6" fill="#35c78f"/>
    <g fill="none" stroke="#F2EFE9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 30 L 33 20 L 33 62" stroke-width="9"/>
      <circle cx="50" cy="30" r="6.4" stroke-width="5"/>
      <circle cx="68" cy="52" r="6.4" stroke-width="5"/>
      <line x1="69" y1="26" x2="49" y2="56" stroke-width="5"/>
    </g>
  </g>

  <!-- wordmark + line -->
  <text x="352" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#F2EFE9">1%</text>
  <rect x="352" y="176" width="300" height="2" rx="1" fill="url(#rule)"/>
  <text x="352" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#c8ccd2">Get one percent better every day.</text>
  <text x="352" y="256" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="2.4" fill="#8a8f98">WORKOUTS · HABITS · FOCUS · BREATH · STACKS · FASTING · STRENGTH</text>
  <text x="352" y="290" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1.6" fill="#5d636c">LOCAL-FIRST · OFFLINE · NO ACCOUNT</text>
</svg>
